name: DevSecOps Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

#############################################################################
# PULL REQUEST SECURITY CHECKS
#############################################################################

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  semgrep:
    name: SAST Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  checkov:
    name: IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile

  hadolint:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java Example
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Tests
        run: |
          ./mvnw clean test

#############################################################################
# BUILD AFTER MERGE TO MAIN
#############################################################################

  build-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - semgrep
      - sonarqube
      - checkov
      - hadolint
      - trivy-fs
      - tests

    outputs:
      image-tag: ${{ github.sha }}

    steps:

      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t myrepo/myapp:${{ github.sha }} .

#############################################################################
# IMAGE SECURITY SCAN
#############################################################################

  trivy-image:
    name: Container Scan
    if: github.event_name == 'push'

    runs-on: ubuntu-latest
    needs: build-image

    steps:

      - uses: actions/checkout@v4

      - name: Build Image
        run: |
          docker build \
          -t myrepo/myapp:${{ github.sha }} .

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: myrepo/myapp:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

#############################################################################
# SBOM GENERATION
#############################################################################

  sbom:
    name: Generate SBOM
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs: trivy-image

    steps:

      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action@v0

      - name: Generate SBOM
        run: |
          syft dir:. -o spdx-json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

#############################################################################
# PUSH IMAGE
#############################################################################

  push-image:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs:
      - sbom

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
          -t myrepo/myapp:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push myrepo/myapp:${{ github.sha }}

#############################################################################
# UPDATE GITOPS REPOSITORY
#############################################################################

  update-gitops:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs:
      - push-image

    steps:

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: your-org/gitops-repo
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Update Image Tag
        run: |
          sed -i 's/tag:.*/tag: "${{ github.sha }}"/' \
          environments/dev/values.yaml

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .
          git commit -m "Deploy image ${{ github.sha }}"
          git push
