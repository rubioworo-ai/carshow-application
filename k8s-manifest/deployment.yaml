
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carshow-application
  namespace: nimbus-dev 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carshow-application
  template:
    metadata:
      labels:
        app: carshow-application
    spec:
      containers:
        - name: carshow-application
          image: ghcr.io/rubioworo-ai/carshow-application:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
