name: Infrastructure Provisioning Pipeline (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - "terraform-aks/**"
      - ".github/workflows/infra-terraform.yaml"
    paths:
      - "terraform-aks/**"

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  checkov-terraform:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directory for Reports
        run: mkdir -p reports

      - name: Run Terraform Checkov Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory /repo/terraform-aks \
            --framework terraform \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload Checkov SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

  terraform-deploy:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: checkov-terraform
    defaults:
      run:
        working-directory: ./terraform-aks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init --upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan