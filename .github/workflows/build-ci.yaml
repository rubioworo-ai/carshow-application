name: DevSecOps Pipeline for Car Web Application

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ci.yaml"
      - "Dockerfile"
      - "src/**"

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source="/repo" \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  checkov-terraform:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Run Checkov Terraform Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            bridgecrew/checkov:latest \
            --directory /repo/terraform-aks \
            --framework terraform \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-checkov-report
          path: reports/results_sarif.sarif

  checkov-dockerfile:
    name: Dockerfile Security Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Run Checkov Dockerfile Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            bridgecrew/checkov:latest \
            --directory /repo \
            --framework dockerfile \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile-checkov-report
          path: reports/results_sarif.sarif

  checkov-kubernetes:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Run Kubernetes Checkov Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            bridgecrew/checkov:latest \
            --directory /repo/k8s-manifest \
            --framework kubernetes \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-checkov-report
          path: reports/results_sarif.sarif

  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  code-lint-and-test:
    name: Code Linting and Tests
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests
#
  sast-and-trivy-fs:
    name: SAST and Filesystem Scan
    runs-on: ubuntu-latest
    needs:
      - code-lint-and-test
      - hadolint

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            semgrep/semgrep \
            semgrep scan \
            --config p/javascript \
            --sarif \
            --output semgrep.sarif \
            /src

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: sast-and-trivy-fs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Sonar Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
  build-and-push-acr:
    name: Build Scan Sign and Push
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: nimbusacrj9tt6o.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        run: |
          docker build \
            -t nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }} .

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft docker:nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }} \
          -o spdx-json > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.json

      - name: Push Image
        run: |
          docker push nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }}

          docker tag \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }} \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:latest

          docker push \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign Image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
          nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }}

      - name: Create Attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom.json \
            --type spdxjson \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }}

      - name: Verify Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }} \
            > cosign-verification.json

      - name: Verify Attestation
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            nimbusacrj9tt6o.azurecr.io/carshowroom-app:${{ github.sha }} \
            > cosign-attestation.json

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-attestations
          retention-days: 14
          path: |
            sbom.json
            cosign-verification.json
            cosign-attestation.json