name: DevSecOps Pipeline for Car Web Application

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ci.yaml"
      - "Dockerfile"
      - "src/**"


permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source="/repo" \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  code-lint-and-test:
    name: Code Linting & Unit Tests
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

  checkov-terraform:
    name: Terraform Security Scan (Checkov)
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform-aks
          framework: terraform
          output_format: sarif
          output_file_path: reports/terraform.sarif
          soft_fail: true
          continue-on-error: true

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/terraform.sarif

  checkov-dockerfile:
    name: Dockerfile Security Scan (Checkov)
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov Dockerfile Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: reports/dockerfile.sarif
          soft_fail: true

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dockerfile.sarif

  checkov-kubernetes:
    name: Kubernetes Security Scan (Checkov)
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov Kubernetes Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./k8s-manifest
          framework: kubernetes
          output_format: sarif
          output_file_path: reports/kubernetes.sarif
          soft_fail: true
          continue-on-error: true

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/kubernetes.sarif

  trivy-fs:
    name: Trivy Filesystem Scan
    needs: [code-lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: 0

  sonarqube:
    name: SonarQube SAST Scan
    runs-on: ubuntu-latest
    needs: [code-lint-and-test, trivy-fs]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sbom-generate:
    name: Generate SBOM (CycloneDX)
    needs: sonarqube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm --silent

      - name: Generate SBOM JSON
        run: cyclonedx-npm --output-file sbom.json --output-format json || true

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-json
          path: sbom.json

  build-and-push-multi-registry:
    name: Build, Cache, Scan, Sign & Push (GHCR & Docker Hub)
    runs-on: ubuntu-latest
    needs: sbom-generate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, Cache & Push to Multiple Registries
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ tolower(github.repository) }}:${{ github.sha }}
            ghcr.io/${{ tolower(github.repository) }}:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/carshowroom-app:${{ github.sha }}
            docker.io/${{ secrets.DOCKER_USERNAME }}/carshowroom-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ tolower(github.repository) }}:${{ github.sha }}'
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          exit-code: 1

      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign Container Image Keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ tolower(github.repository) }}:${{ github.sha }}

      - name: Upload Security Attestation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-attestations
          path: |
            sbom.json
          retention-days: 14
